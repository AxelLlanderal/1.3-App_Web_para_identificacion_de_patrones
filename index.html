<!DOCTYPE html>
<html lang="es">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Detección y Conteo de Elementos - IA</title>
   <link rel="stylesheet" href="assets/css/styles.css">
   <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

   <main class="app">
       <header class="header">
           <div>
               <h1>Contador & Detector de Imagen</h1>
               <p>Sube una imagen para identificar y contar sus elementos</p>
           </div>
           <span class="status">● Visión IA lista</span>
       </header>

       <section id="messages" class="messages" aria-live="polite">
           <div class="message assistant">
               <div class="message-label">IA</div>
               <div class="message-content">
                   Hola. Selecciona una imagen desde tu dispositivo para que pueda analizarla, señalar y contar todos sus elementos.
               </div>
           </div>
       </section>

       <form id="chatForm" class="chat-form">
           <input
               id="imageInput"
               type="file"
               accept="image/*"
               required
           >
           <button id="sendButton" type="submit">Analizar Imagen</button>
       </form>

       <footer class="footer">
           Desarrollado por <strong>Axel Llanderal Arteaga</strong>
       </footer>
   </main>

   <script src="assets/js/app.js"></script>
</body>
</html>
